# gp3 StorageClass backed by the AWS EBS CSI driver.
# EKS ships a legacy gp2 class on the removed in-tree provisioner and marks
# nothing as default, so we create our own and make it the default.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: gp3
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
provisioner: ebs.csi.aws.com
# Create the EBS volume only after the scheduler picks a node, so the volume
# lands in the same AZ as the pod that mounts it.
volumeBindingMode: WaitForFirstConsumer
# Lets you grow a full Prometheus volume in place instead of recreating it.
allowVolumeExpansion: true
# Deleting the PVC deletes the EBS volume, so teardown leaves nothing billing.
reclaimPolicy: Delete
parameters:
  type: gp3
  encrypted: "true"
