apiVersion: apps/v1
kind: Deployment
metadata:
  name: monitoring-demo
  namespace: default
  labels:
    app: monitoring-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: monitoring-demo
  template:
    metadata:
      labels:
        app: monitoring-demo
    spec:
      containers:
        - name: monitoring-demo
          # Replaced by: sed -i '' "s/YOUR_ACCOUNT/$AWS_ACCOUNT/g" deployment.yaml
          image: YOUR_ACCOUNT.dkr.ecr.us-east-1.amazonaws.com/monitoring-demo:latest
          ports:
            # The port NAME matters — the ServiceMonitor references this name,
            # not the number.
            - containerPort: 3000
              name: http
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "200m"
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: monitoring-demo
  namespace: default
  labels:
    # The ServiceMonitor selects the Service by this label.
    app: monitoring-demo
spec:
  selector:
    app: monitoring-demo
  ports:
    - name: http          # must match the ServiceMonitor's `port:` value
      port: 3000
      targetPort: 3000
